name: "Parity Harness (cosine + reranker)"

# Heavy harness — downloads ~30 GB of ONNX weights from HF and runs through
# every fixture in tests/cosine_parity.rs and tests/reranker_parity.rs.
# Manual trigger + weekly Sunday cron.  NOT run on every PR (see test.yml).

on:
  workflow_dispatch:
    inputs:
      which:
        description: "Which harness to run"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - cosine_parity
          - reranker_parity
  schedule:
    # Sundays 04:00 UTC — runs on the default branch
    - cron: '0 4 * * 0'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  ONNX_VERSION: v1.24.4

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v3

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false

      - name: Restore ORT build cache
        id: cache-build-restore
        uses: actions/cache/restore@v4
        with:
          key: '${{ runner.os }}-onnxruntime-${{ env.ONNX_VERSION }}'
          path: |
            onnxruntime/build/Linux/Release/

      - name: Compile ONNX Runtime for Linux
        if: steps.cache-build-restore.outputs.cache-hit != 'true'
        run: |
          echo Cloning ONNX Runtime repository...
          git clone https://github.com/microsoft/onnxruntime --recursive --branch $ONNX_VERSION --single-branch --depth 1
          cd onnxruntime
          ./build.sh --update --build --config Release --parallel --compile_no_warning_as_error --skip_submodule_sync
          cd ..

      # Cache the HF model blobs that the parity harness downloads (~5–6 GB
      # of ONNX weights for the active fixture set).  Key on the test files
      # that pin which models get downloaded: when FIXTURES change or when
      # we wire up a new ModelInfo, the cache key changes and the next
      # scheduled run re-downloads from HF.  Falls back to a previous cache
      # via restore-keys when the key changes incrementally.
      - name: Restore HF blob cache
        id: cache-hf-restore
        uses: actions/cache/restore@v4
        with:
          key: ${{ runner.os }}-fastembed-hf-${{ hashFiles('tests/cosine_parity.rs', 'tests/reranker_parity.rs', 'src/models/text_embedding.rs', 'src/models/reranking.rs') }}
          restore-keys: |
            ${{ runner.os }}-fastembed-hf-
          path: |
            .fastembed_cache/

      - name: Cosine Parity
        if: ${{ github.event_name == 'schedule' || inputs.which == 'both' || inputs.which == 'cosine_parity' }}
        run: |
          ORT_LIB_LOCATION="$(pwd)/onnxruntime/build/Linux/Release" \
          cargo test --release --no-default-features --features hf-hub-native-tls,image-models \
            --test cosine_parity -- --nocapture

      - name: Reranker Parity
        if: ${{ github.event_name == 'schedule' || inputs.which == 'both' || inputs.which == 'reranker_parity' }}
        run: |
          ORT_LIB_LOCATION="$(pwd)/onnxruntime/build/Linux/Release" \
          cargo test --release --no-default-features --features hf-hub-native-tls,image-models \
            --test reranker_parity -- --nocapture

      - name: Always Save ORT Cache
        if: always() && steps.cache-build-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: '${{ steps.cache-build-restore.outputs.cache-primary-key }}'
          path: |
            onnxruntime/build/Linux/Release/

      - name: Always Save HF blob Cache
        if: always() && steps.cache-hf-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: '${{ steps.cache-hf-restore.outputs.cache-primary-key }}'
          path: |
            .fastembed_cache/
