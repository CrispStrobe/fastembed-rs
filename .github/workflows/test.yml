name: "Cargo Tests"
on:
  pull_request:
  push:
    branches: [main, probe/ort-rc12]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  ONNX_VERSION: v1.24.4

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # this might remove tools that are actually needed,
          tool-cache: false

      - name: Restore Builds
        id: cache-build-restore
        uses: actions/cache/restore@v5
        with:
          key: '${{ runner.os }}-onnxruntime-${{ env.ONNX_VERSION }}'
          path: |
            onnxruntime/build/Linux/Release/

      - name: Compile ONNX Runtime for Linux
        if: steps.cache-build-restore.outputs.cache-hit != 'true'
        run: |
          echo Cloning ONNX Runtime repository...
          git clone https://github.com/microsoft/onnxruntime --recursive --branch $ONNX_VERSION --single-branch --depth 1
          cd onnxruntime
          ./build.sh --update --build --config Release --parallel --compile_no_warning_as_error --skip_submodule_sync
          cd ..

      # The cosine_parity / reranker_parity harnesses download multi-GB ONNX
      # weights (SmoothQuant decoder LLMs, V5 Small, Zerank 1.7B, etc.) and
      # take 15+ minutes each.  They run under `parity-harness.yml` (manual /
      # scheduled), not on every PR.
      - name: Cargo Test With Release Build
        run: |
          ORT_LIB_LOCATION="$(pwd)/onnxruntime/build/Linux/Release" \
          cargo test --release --no-default-features --features hf-hub-native-tls,image-models \
            -- \
            --skip cosine_parity_against_pytorch_reference \
            --skip reranker_parity_against_pytorch_reference

      - name: Cargo Test Offline
        run: |
          ORT_LIB_LOCATION="$(pwd)/onnxruntime/build/Linux/Release" \
          cargo test --no-default-features --features image-models \
            -- \
            --skip cosine_parity_against_pytorch_reference \
            --skip reranker_parity_against_pytorch_reference

      - name: Cargo Clippy
        run: cargo clippy

      - name: Cargo FMT
        run: cargo fmt --all -- --check

      # 4-variant cosine-parity smoke: AllMiniLML6V2 (FP32 baseline),
      # GteModernBertBaseQ4F16 (Q4F16 path), OctenEmbedding0_6BInt4Full
      # (INT4 MatMulNBits), JinaEmbeddingsV3 (ST-task LoRA path).  Total
      # download ≲ 1.5 GB; runs in ~5 min once the HF blobs are cached.
      # The full 14-variant harness still runs under parity-harness.yml.
      - name: Restore HF smoke cache
        id: cache-hf-smoke-restore
        uses: actions/cache/restore@v5
        with:
          key: ${{ runner.os }}-fastembed-hf-smoke-${{ hashFiles('tests/cosine_parity.rs', 'src/models/text_embedding.rs') }}
          restore-keys: |
            ${{ runner.os }}-fastembed-hf-smoke-
          path: |
            .fastembed_cache/

      - name: Cosine Parity Smoke
        env:
          COSINE_PARITY_SMOKE: '1'
        run: |
          ORT_LIB_LOCATION="$(pwd)/onnxruntime/build/Linux/Release" \
          cargo test --release --no-default-features --features hf-hub-native-tls,image-models \
            --test cosine_parity -- --nocapture

      - name: Always Save Cache
        id: cache-build-save
        if: always() && steps.cache-build-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: '${{ steps.cache-build-restore.outputs.cache-primary-key }}'
          path: |
            onnxruntime/build/Linux/Release/

      - name: Always Save HF smoke Cache
        if: always() && steps.cache-hf-smoke-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: '${{ steps.cache-hf-smoke-restore.outputs.cache-primary-key }}'
          path: |
            .fastembed_cache/
