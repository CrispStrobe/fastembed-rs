# Aggregate registry of harness fixtures.
#
# Single source of truth for which upstream models the harness gates
# against, at which pinned commit hash, and with what threshold.  Each
# entry is also recorded inside its own safetensors file's metadata,
# but this file collects them for review and pinning.
#
# Sections:
#   [embedder.<key>] — used by `tests/cosine_parity.rs`
#   [reranker.<key>] — used by `tests/reranker_parity.rs`
#
# `key` is the path stem of the fixture file (`tests/fixtures/<key>.safetensors`).
# A single fixture is shared across all sibling quantized variants of one
# model family (FP16, INT8, INT4, etc. all run against the same PyTorch
# reference embedding).

# =============================================================================
# Embedder fixtures (cosine-parity)
# =============================================================================

