[reranker.JINARerankerV2BaseMultilingual]
file = "tests/fixtures/reranker__JINARerankerV2BaseMultiligual.safetensors"
model_repo = "jinaai/jina-reranker-v2-base-multilingual"
revision = "9cfeff2df7d40d1b78e75e5e9cebec92a99813c9"
score_convention = "logit_1class"
threshold_spearman = 0.9
gates = ["JINARerankerV2BaseMultiligual", "JINARerankerV2BaseMultilingualFp16"]  # Int8 disabled, see notes
notes = """
Reference picks English over German on the Mitose group — that is PyTorch's \
actual behaviour (multilingual reranker preferring better-attested English \
text); ref_top1 reflects this and ONNX is gated against ref_top1, not the \
hardcoded expected_top1.  Fp16 unblocked by `ort = 2.0.0-rc.12` (ORT 1.24) \
— verified pass1 on probe/ort-rc12 with Spearman=1.0 and full top1 match.  \
Int8 has Spearman=0.979 (OK) but top1 mismatch in group 1 (got [0,5,8,13] \
vs ref [0,4,8,13]) — pre-existing INT8 drift, gated OUT."""

[reranker.LlamaNemotronRerank1BV2]
file = "tests/fixtures/reranker__LlamaNemotronRerank1BV2.safetensors"
model_repo = "nvidia/llama-nemotron-rerank-1b-v2"
score_convention = "logit_1class"
threshold_spearman = 0.9
gates = ["LlamaNemotronRerank1BV2", "LlamaNemotronRerank1BV2Int4Full"]
notes = """
Int8 was DROPPED entirely (Spearman 0.49, ranking collapse — Qwen3-style \
outlier on LLaMA-3.2).  Int4Full preserves dynamic range better — empirically \
on rc.12 (reranker_parity pass1, 2026-05-03) Spearman=0.944, full top1 match.  \
Required ORT >= 1.23 for Int4Full's GatherBlockQuantized; rc.12 ships ORT 1.24 \
which works fine (unlike SmoothQuant Int8 / V5Small / HarrierQ which need ORT 1.25)."""

