notes = """
Decoder LLM (Qwen3-0.6B fine-tune).  Int8 is SmoothQuant α=0.8 (vanilla \
quantize_dynamic collapsed to cos_min=0.64 on the German Klimawandel sentence \
— see harness rejection on 2026-05-03; SmoothQuant recovers cos_min=0.987 on \
Python ORT 1.25).  ORT 1.24 — which ships in `ort = 2.0.0-rc.12`, the newest \
crate version as of 2026-05 — still fails Initialize() on the SmoothQuant \
graph with "Encountered unknown exception in Initialize()", so \
OctenEmbedding0_6BInt8 is currently gated OUT of the harness.  Re-enable \
when an ort crate exposing ORT 1.25+ lands."""

