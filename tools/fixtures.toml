[embedder.JinaEmbeddingsV5Small]
file = "tests/fixtures/JinaEmbeddingsV5Small.safetensors"
model_repo = "jinaai/jina-embeddings-v5-text-small-retrieval"
revision = "6856e76bb72982e58de0620458a4e8b3614da340"
pooling = "last_token"
threshold = 0.90
threshold_overrides = { JinaEmbeddingsV5SmallFp16 = 0.99 }
gates = []  # both disabled, see notes
notes = """
Asymmetric retrieval prefixes ('Query: ' / 'Document: ') NOT applied to the \
canonical TEXTS — fastembed-rs's embed() doesn't auto-prefix either, so harness \
math is consistent.  ORT 1.24 (in `ort = 2.0.0-rc.12`) currently fails \
Initialize() on the V5Small Fp16 graph (verified empirically 2026-05-03) — same \
symptom as the SmoothQuant Int8 graphs.  V5SmallInt8 is also gated OUT pending \
an ort crate exposing ORT 1.25+.  Note V5 Small is custom-code Jina-bert-v2; \
the streaming FP16 export emits a graph pattern ORT 1.24 can't handle."""

[embedder.JinaEmbeddingsV3]
file = "tests/fixtures/JinaEmbeddingsV3.safetensors"
model_repo = "jinaai/jina-embeddings-v3"
revision = "ab036b023d30b4d1138c4c3bfa9f0c445ab455d6"
pooling = "st:retrieval.passage"  # SentenceTransformer encode(task=...) applies LoRA adapter
threshold = 0.95
gates = ["JinaEmbeddingsV3"]
notes = """
XLM-R + LoRA task adapters.  Reference path uses SentenceTransformer.encode(\
task='retrieval.passage') so the LoRA adapter is applied — bare \
AutoModel.forward+mean pooling would silently produce non-LoRA embeddings and \
mis-validate.  Generated via `tools/dump_reference.py --st-task retrieval.passage`.  \
fastembed-rs's ONNX bakes task_id=1 (retrieval.passage) into the graph, so the \
reference and ONNX are testing the same task adapter."""

[embedder.JinaEmbeddingsV5Nano]
file = "tests/fixtures/JinaEmbeddingsV5Nano_extended.safetensors"
model_repo = "jinaai/jina-embeddings-v5-text-nano-retrieval"
revision = "ac5d898c8d382b17167c33e5c8af644a3519b47d"
pooling = "last_token"
threshold = 0.90
gates = []  # disabled, see notes
notes = """
20-text multilingual probe (6 canonical + 14 from tools/v5_nano_extended_probe.txt).  \
Investigation result (probe/ort-rc12 pass3, 2026-05-03): canonical 6-text probe gave \
cos_min=0.557 on row 1 (LEARNINGS Phase 9 #7); the 20-text extended probe gives the \
same cos_min=0.557 on the same row (cos_mean=0.975, the other 19 rows ≥0.97).  This \
is NOT small-sample noise — V5 Nano really does degenerate on one specific text.  \
Currently gated OUT because the harness asserts cos_min, not cos_mean.  Fixture is \
kept for offline analysis."""

[embedder.HarrierOSSV1_270M]
file = "tests/fixtures/HarrierOSSV1_270M.safetensors"
model_repo = "microsoft/harrier-oss-v1-270m"
revision = "31de22b673913c7d658c0f03f792d77c2dcf8ebd"
pooling = "last_token"
threshold = 0.99
gates = []  # disabled, see notes
notes = """
ONNX uses GatherBlockQuantized.bits — was expected to need ORT >= 1.23.  Empirically \
(probe/ort-rc12 pass3, 2026-05-03), ORT 1.24 still fails Initialize() on this graph \
with "Encountered unknown exception in Initialize()" — same symptom as the \
SmoothQuant Int8 graphs and V5Small Fp16.  Gated OUT pending an ort crate \
exposing ORT 1.25+.  The `load_tokenizer_hf_hub` relaxation in src/common.rs \
(also 2026-05-03) means the tokenizer load no longer 404s on this repo's \
missing special_tokens_map.json; the model will become loadable when the \
runtime side catches up.  HarrierOSSV1_270M (FP32) ships via exact-checksum \
on main and re-uses this fixture if cosine-parity gating is added later."""

