Q4F16 unblocked by `ort = 2.0.0-rc.12` (ORT 1.24) — verified pass1 on \
probe/ort-rc12 with Spearman=0.985 and full top1 match.  Q is English-only \
(per-group Spearman drops to ~0.8 on non-English queries — but global \
Spearman 0.974 stays ≥0.9).  Empirically on rc.12, top1 mismatch in groups \
